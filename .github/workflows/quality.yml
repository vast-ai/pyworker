name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.6.9

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Ruff baseline checks
        run: ruff check . --select F,E9

  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check worker startup script
        run: shellcheck --severity=warning --exclude=SC1090 start_server.sh
